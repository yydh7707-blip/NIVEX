name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix src/NIVEX.Api
      - run: npm --prefix src/NIVEX.Api test
      - run: npm --prefix src/NIVEX.Api run typecheck
      - run: npm install --prefix src/NIVEX.Web
      - run: npm --prefix src/NIVEX.Web run typecheck

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test NIVEX.sln
      - run: dotnet build src/NIVEX.Desktop/NIVEX.Desktop.csproj -c Release
